<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Primary Green Gradient -->
    <linearGradient id="ofoqBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3D2F" />
      <stop offset="50%" stop-color="#13523F" />
      <stop offset="100%" stop-color="#22734A" />
    </linearGradient>

    <!-- Golden Horizon Sun Gradient -->
    <linearGradient id="ofoqSunGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Book Pages Glow -->
    <linearGradient id="pagesGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#ofoqBgGrad)" />
  <rect x="10" y="10" width="100" height="100" rx="26" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2" />

  <!-- Rising Horizon Sun (الأفق) -->
  <circle cx="60" cy="50" r="22" fill="url(#ofoqSunGrad)" opacity="0.95" filter="url(#softGlow)" />

  <!-- Horizon Rays / Orbit Arc -->
  <path d="M30 52 C42 42 78 42 90 52" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M24 60 C40 48 80 48 96 60" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.6" stroke-dasharray="3 3" />

  <!-- Open Textbook Base (الكتاب المفتوح) -->
  <!-- Left Page -->
  <path d="M60 84 C48 76 34 78 24 81 V58 C34 55 48 53 60 61 Z" fill="url(#pagesGrad)" />
  <!-- Right Page -->
  <path d="M60 84 C72 76 86 78 96 81 V58 C86 55 72 53 60 61 Z" fill="url(#pagesGrad)" />

  <!-- Book Spine Center Fold -->
  <path d="M60 61 V85" stroke="#13523F" stroke-width="2.5" stroke-linecap="round" />

  <!-- Academic Excellence Star / Diamond at the Zenith -->
  <polygon points="60,22 63,29 70,30 65,35 66,42 60,38 54,42 55,35 50,30 57,29" fill="#FDE047" />

  <!-- Horizon Line of Knowledge -->
  <line x1="20" y1="88" x2="100" y2="88" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
</svg>
